          type: ["boolean", "null"]
        featured:
          type: ["boolean", "null"]
        stock:
          type: ["integer", "null"]

    # ─── ORDER ─────────────────────────────────────────────────────
    Order:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        totalAmount:
          type: number
        finalAmount:
          type: number
        status:
          type: string
        paymentStatus:
          type: string
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
      required: [id, userId, totalAmount, finalAmount, status, paymentStatus, createdAt, items]

    OrderItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        quantity:
          type: integer
        price:
          type: number
        productName:
          type: ["string", "null"]
      required: [id, productId, quantity, price]

    UpdateOrderBody:
      type: object
      properties:
        status:
          type: ["string", "null"]
        paymentStatus:
          type: ["string", "null"]

    # ─── CAMPAIGN ──────────────────────────────────────────────────
    Campaign:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        status:
          type: string
        subject:
          type: ["string", "null"]
        content:
          type: string
        scheduledAt:
          type: ["string", "null"]
        sentAt:
          type: ["string", "null"]
        recipientsCount:
          type: integer
        sentCount:
          type: integer
        openedCount:
          type: integer
        clickedCount:
          type: integer
        createdAt:
          type: string
      required: [id, name, type, status, content, recipientsCount, sentCount, openedCount, clickedCount, createdAt]

    CreateCampaignBody:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        subject:
          type: ["string", "null"]
        content:
          type: string
        targetSegment:
          type: object
          additionalProperties: true
        scheduledAt:
          type: ["string", "null"]
      required: [name, type, content, targetSegment]

    UpdateCampaignBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        scheduledAt:
          type: ["string", "null"]
        content:
          type: ["string", "null"]

    # ─── NPS ───────────────────────────────────────────────────────
    NpsResponse:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        score:
          type: integer
        classification:
          type: string
        feedback:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, userId, score, classification, createdAt]

    NpsSummary:
      type: object
      properties:
        averageScore:
          type: number
        npsScore:
          type: number
        promoters:
          type: integer
        passives:
          type: integer
        detractors:
          type: integer
        total:
          type: integer
      required: [averageScore, npsScore, promoters, passives, detractors, total]

    # ─── USER ──────────────────────────────────────────────────────
    UserProfile:
      type: object
      properties:
        id:
          type: string
        clerkId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        avatarUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        tenantId:
          type: ["string", "null"]
        referralCode:
          type: string
        referralBalance:
          type: number
        createdAt:
          type: string
      required: [id, clerkId, name, email, role, isActive, referralCode, referralBalance, createdAt]

    SyncUserBody:
      type: object
      properties:
        clerkId:
          type: string
        name:
          type: string
        email:
          type: string
        avatarUrl:
          type: ["string", "null"]
      required: [clerkId, name, email]

    CreateUserBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
      required: [name, email, role]

    UpdateUserBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
        isActive:
          type: ["boolean", "null"]
