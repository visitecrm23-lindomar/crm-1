        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, slug, email, planId, status, userCount, clientCount, tripCount, reservationCount, createdAt, updatedAt]

    # ─── ADMIN USER ─────────────────────────────────────────────────
    AdminUserItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        isActive:
          type: boolean
        tenantId:
          type: ["string", "null"]
        tenantName:
          type: ["string", "null"]
        tenantStatus:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, name, email, role, isActive, createdAt]

    # ─── AUDIT LOG WITH TENANT ──────────────────────────────────────
    AuditLogWithTenant:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        userId:
          type: ["string", "null"]
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        before:
          type: object
          nullable: true
        after:
          type: object
          nullable: true
        ipAddress:
          type: ["string", "null"]
        createdAt:
          type: string
        tenantName:
          type: ["string", "null"]
        userName:
          type: ["string", "null"]
        userEmail:
          type: ["string", "null"]
      required: [id, tenantId, action, entityType, entityId, createdAt]

    # ─── SUBSCRIPTION ───────────────────────────────────────────────
    Subscription:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        planId:
          type: string
