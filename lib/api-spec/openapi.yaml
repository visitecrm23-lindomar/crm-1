      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        email:
          type: string
        whatsapp:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        primaryColor:
          type: ["string", "null"]
        secondaryColor:
          type: ["string", "null"]
        planId:
          type: string
        status:
          type: string
        cnpj:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        zipCode:
          type: ["string", "null"]
        userCount:
          type: integer
        clientCount:
          type: integer
        tripCount:
          type: integer
        reservationCount:
          type: integer
        planMaxUsers:
          type: ["integer", "null"]
        planMaxClients:
          type: ["integer", "null"]
        planMaxTrips:
          type: ["integer", "null"]
        maxUsersOverride:
          type: ["integer", "null"]
