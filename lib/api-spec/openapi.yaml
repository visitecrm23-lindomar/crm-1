components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    # ─── DASHBOARD ─────────────────────────────────────────────────
    DashboardSummary:
      type: object
      properties:
        totalClients:
          type: integer
        newClientsThisMonth:
          type: integer
        totalTrips:
          type: integer
        activeTrips:
          type: integer
        totalRevenue:
          type: number
        revenueThisMonth:
          type: number
        pendingPayments:
          type: number
        totalReservations:
          type: integer
        confirmedReservations:
          type: integer
        occupancyRate:
          type: number
        averageNps:
          type: ["number", "null"]
        openDeals:
          type: integer
        dealsPipelineValue:
          type: number
      required:
        - totalClients
        - newClientsThisMonth
        - totalTrips
        - activeTrips
        - totalRevenue
        - revenueThisMonth
        - pendingPayments
        - totalReservations
        - confirmedReservations
        - occupancyRate
        - openDeals
        - dealsPipelineValue

    ChartDataPoint:
      type: object
      properties:
        label:
          type: string
        revenue:
          type: number
        expenses:
          type: number
        reservations:
          type: integer
      required: [label, revenue, expenses, reservations]

    TripSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        destination:
          type: string
        departureDate:
          type: string
        availableSeats:
          type: integer
        totalCapacity:
          type: integer
        status:
          type: string
        coverImage:
          type: ["string", "null"]
      required: [id, name, destination, departureDate, availableSeats, totalCapacity, status]

    ActivityItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        description:
          type: string
        createdAt:
          type: string
        entityId:
          type: ["string", "null"]
        entityType:
          type: ["string", "null"]
      required: [id, type, description, createdAt]

    # ─── CLIENT ────────────────────────────────────────────────────
    Client:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        whatsapp:
          type: string
        phone:
          type: ["string", "null"]
        cpf:
          type: ["string", "null"]
        rg:
          type: ["string", "null"]
        birthDate:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        instagram:
          type: ["string", "null"]
        addressCity:
          type: ["string", "null"]
        addressState:
          type: ["string", "null"]
        classification:
          type: string
        status:
          type: string
        tags:
          type: array
          items:
            type: string
        pipelineStage:
          type: string
        totalSpent:
          type: number
        outstandingBalance:
          type: number
        npsScore:
          type: ["integer", "null"]
        observations:
          type: ["string", "null"]
        dreamDestinations:
          type: array
          items:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        lastContactAt:
          type: ["string", "null"]
      required:
        - id
        - name
        - email
        - whatsapp
        - classification
        - status
        - tags
        - pipelineStage
        - totalSpent
        - outstandingBalance
        - dreamDestinations
        - createdAt
        - updatedAt

    ClientListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required: [data, total, page, limit]

    CreateClientBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        whatsapp:
          type: string
        phone:
          type: ["string", "null"]
        cpf:
          type: ["string", "null"]
        birthDate:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        addressCity:
          type: ["string", "null"]
        addressState:
          type: ["string", "null"]
        observations:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        dreamDestinations:
          type: array
          items:
            type: string
      required: [name, email, whatsapp]

    UpdateClientBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        whatsapp:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        cpf:
          type: ["string", "null"]
        birthDate:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        classification:
          type: ["string", "null"]
        tags:
          type: ["array", "null"]
          items:
            type: string
        observations:
          type: ["string", "null"]
        dreamDestinations:
          type: ["array", "null"]
          items:
            type: string
        addressCity:
          type: ["string", "null"]
        addressState:
          type: ["string", "null"]
        npsScore:
          type: ["integer", "null"]
        pipelineStage:
          type: ["string", "null"]
        lastContactAt:
          type: ["string", "null"]

    # ─── NOTE ──────────────────────────────────────────────────────
    Note:
      type: object
      properties:
        id:
          type: string
        clientId:
          type: string
        content:
          type: string
        isPrivate:
          type: boolean
        createdById:
          type: string
        createdAt:
          type: string
      required: [id, clientId, content, isPrivate, createdById, createdAt]

    CreateNoteBody:
      type: object
      properties:
        content:
          type: string
        isPrivate:
          type: boolean
      required: [content]

    # ─── TRIP ──────────────────────────────────────────────────────
    Trip:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        destination:
          type: string
        destinationCity:
          type: string
        destinationState:
          type: string
        type:
          type: string
        category:
          type: string
        departureDate:
          type: string
        returnDate:
          type: ["string", "null"]
        totalCapacity:
          type: integer
        availableSeats:
          type: integer
        reservedSeats:
          type: integer
        confirmedSeats:
          type: integer
        priceAdult:
          type: number
        priceChild:
          type: ["number", "null"]
        priceSenior:
          type: ["number", "null"]
        inclusions:
          type: array
          items:
            type: string
        exclusions:
          type: array
          items:
            type: string
        coverImage:
          type: ["string", "null"]
        gallery:
          type: array
          items:
            type: string
        status:
          type: string
        isPublic:
          type: boolean
        isFeatured:
          type: boolean
        vehiclePlate:
          type: ["string", "null"]
        vehicleType:
          type: ["string", "null"]
        driverName:
          type: ["string", "null"]
